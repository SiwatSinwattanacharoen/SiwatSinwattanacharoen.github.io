<script>
(function () {
  var canvas = document.getElementById('c'), renderer;
  try { renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true }); }
  catch (e) { canvas.style.display = 'none'; document.getElementById('err').style.display = 'block'; return; }

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a0f);
  var camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);

  scene.add(new THREE.AmbientLight(0xfff1e0, 0.7));
  var sun = new THREE.DirectionalLight(0xffffff, 0.55); sun.position.set(6, 10, 8); scene.add(sun);
  var lampLight = new THREE.PointLight(0xffc27a, 0.9, 8); lampLight.position.set(-0.8, 2.0, -3.3); scene.add(lampLight);
  var screenLight = new THREE.PointLight(0x6aa8ff, 0.7, 6); screenLight.position.set(2.2, 2.3, -2.6); scene.add(screenLight);

  // ---------- helpers ----------
  function box(w, h, d, color, x, y, z, parent, emissive) {
    var mat = new THREE.MeshLambertMaterial({ color: color });
    if (emissive) mat.emissive = new THREE.Color(emissive);
    var m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
    m.position.set(x, y, z); (parent || scene).add(m); return m;
  }
  function group(view) { var g = new THREE.Group(); g.userData.view = view; scene.add(g); return g; }
  function canvasTex(w, h, draw) {
    var c = document.createElement('canvas'); c.width = w; c.height = h;
    var t = new THREE.CanvasTexture(c); t.anisotropy = 4; t.flipY = false;
    var redraw = function () { draw(c.getContext('2d'), w, h); t.needsUpdate = true; };
    redraw(); return { tex: t, redraw: redraw };
  }
  var FONT = '"Noto Sans Thai",Tahoma,sans-serif';

  // ---------- room shell (corner cutaway) ----------
  var room = new THREE.Group(); scene.add(room);

  // ---------- bed + nightstand + lamp (click -> bed) ----------
  var bed = group('bed');
  var skillTex = canvasTex(512, 656, function (g, w, h) {
    g.clearRect(0, 0, w, h);
    g.fillStyle = 'rgba(255,255,255,0.14)'; g.fillRect(24, 24, w - 48, h - 48);
    g.strokeStyle = 'rgba(255,255,255,0.7)'; g.lineWidth = 4; g.setLineDash([14, 10]); g.strokeRect(36, 36, w - 72, h - 72); g.setLineDash([]);
    g.fillStyle = '#ffffff'; g.textAlign = 'left';
    g.font = '700 72px ' + FONT; g.fillText('My skill', 80, 160);
    g.fillRect(80, 186, 200, 5);
    g.font = '600 60px ' + FONT;
    ['C', 'Java', 'C++'].forEach(function (t, i) {
      var y = 300 + i * 120;
      g.beginPath(); g.arc(100, y - 20, 11, 0, 7); g.fill();
      g.fillText(t, 140, y);
    });
  });

  // ---------- desk + computer (click -> computer) ----------
  var desk = group('computer');

  var screen = canvasTex(1024, 564, function (g, w, h) {
    var bg = g.createLinearGradient(0, 0, w, h); bg.addColorStop(0, '#0f1b3d'); bg.addColorStop(1, '#1d2f63');
    g.fillStyle = bg; g.fillRect(0, 0, w, h);
    g.fillStyle = '#0b1229'; g.fillRect(0, 0, w, 56);
    g.fillStyle = '#ff5f57'; g.beginPath(); g.arc(32, 28, 9, 0, 7); g.fill();
    g.fillStyle = '#febc2e'; g.beginPath(); g.arc(62, 28, 9, 0, 7); g.fill();
    g.fillStyle = '#28c840'; g.beginPath(); g.arc(92, 28, 9, 0, 7); g.fill();
    g.fillStyle = '#9db4ff'; g.font = '600 24px ' + FONT; g.fillText('about_me.txt', 130, 37);
    g.fillStyle = '#ff9f1a'; g.beginPath(); g.arc(120, 170, 60, 0, 7); g.fill();
    g.fillStyle = '#fff'; g.font = '700 64px ' + FONT; g.textAlign = 'center'; g.fillText('ศ', 120, 192); g.textAlign = 'left';
    g.fillStyle = '#fff'; g.font = '700 46px ' + FONT; g.fillText('ศิวัช สินวัฒนาเจริญ', 210, 172);
    var rows = [['รหัสนิสิต', '6721651858'], ['คณะ', 'ศิลปศาสตร์และวิทยาศาสตร์'], ['สาขา', 'วิทยาการคอมพิวเตอร์'], ['มหาวิทยาลัย', 'เกษตรศาสตร์']];
    rows.forEach(function (r, i) {
      var y = 280 + i * 62;
      g.fillStyle = '#7cc4ff'; g.font = '600 30px ' + FONT; g.fillText(r[0], 60, y);
      g.fillStyle = '#ffffff'; g.font = '400 34px ' + FONT; g.fillText(r[1], 300, y);
    });
  });

  // ---------- photo next to the bed (click -> photo) ----------
  var photo = group('photo');
  var ph = canvasTex(400, 520, function (g, w, h) {   // placeholder until me.jpg loads
    g.fillStyle = '#dfe6ee'; g.fillRect(0, 0, w, h);
    g.fillStyle = '#9aa8b8'; g.beginPath(); g.arc(200, 200, 80, 0, 7); g.fill();
    g.beginPath(); g.ellipse(200, 430, 140, 110, 0, 0, 7); g.fill();
    g.fillStyle = '#54606e'; g.font = '600 26px ' + FONT; g.textAlign = 'center'; g.fillText('วางรูปชื่อ me.jpg', 200, 495);
  });
  var photoMat = new THREE.MeshBasicMaterial({ map: ph.tex });
  var photoLoaded = false;
  new THREE.TextureLoader().load('me.jpg', function (t) { photoLoaded = true; t.flipY = false; photoMat.map = t; photoMat.needsUpdate = true; }, undefined, function () {});

  // ---------- Paint poster on the left wall (click -> paint, click again -> open) ----------
  var paint = group('paint');
  var win = group('window');
  var pt = canvasTex(512, 380, function (g, w, h) {
    g.fillStyle = '#f4f4f4'; g.fillRect(0, 0, w, h);
    g.fillStyle = '#2b5fb8'; g.fillRect(0, 0, w, 40);
    g.fillStyle = '#fff'; g.font = '600 24px ' + FONT; g.fillText('Paint', 14, 28);
    g.fillStyle = '#dcdcdc'; g.fillRect(0, 40, 70, h - 40);
    for (var i = 0; i < 6; i++) { g.fillStyle = '#fff'; g.fillRect(10 + (i % 2) * 30, 52 + Math.floor(i / 2) * 32, 24, 24); }
    g.fillStyle = '#fff'; g.fillRect(80, 50, w - 90, h - 110);
    g.lineCap = 'round'; g.lineWidth = 10; g.strokeStyle = '#e63946';
    g.beginPath(); g.moveTo(110, 220); g.bezierCurveTo(170, 90, 260, 300, 330, 150); g.stroke();
    g.strokeStyle = '#2a9d8f'; g.beginPath(); g.moveTo(120, 300); g.bezierCurveTo(200, 240, 300, 330, 440, 230); g.stroke();
    g.fillStyle = '#f4a261'; g.beginPath(); g.arc(390, 120, 42, 0, 7); g.fill();
    g.strokeStyle = '#457b9d'; g.lineWidth = 6; g.strokeRect(190, 80, 100, 60);
    ['#000', '#e63946', '#f4a261', '#ffd166', '#2a9d8f', '#457b9d', '#6a4c93', '#fff'].forEach(function (c, i) {
      g.fillStyle = c; g.fillRect(84 + i * 40, h - 46, 32, 32); g.strokeStyle = '#888'; g.lineWidth = 1; g.strokeRect(84 + i * 40, h - 46, 32, 32);
    });
  });


  // ---------- shaders (GLSL) ----------
  var uTime = { value: 0 };
  var vertPass = 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }';

  // VERTEX SHADER: curtain cloth. Moves every vertex in z (pleats + wind wave), pinned at the rod (hang = 0)
  var curtainVert = [
    'uniform float uTime; varying vec2 vUv; varying vec3 vWN; varying vec3 vWP; varying float vFold;',
    'void main(){',
    '  vUv = uv; float hang = uv.y; float W = 0.9;',
    '  float ph = uv.x * 6.2831 * 7.0;',
    '  float pleat = sin(ph);',
    '  float w1 = uv.x * 9.0 + uTime * 1.6 + hang * 3.0, w2 = uv.x * 5.0 - uTime * 1.1;',
    '  float wave = 0.5 * sin(w1) + 0.5 * sin(w2);',
    '  float aP = 0.05 * (0.3 + 0.7 * hang), aW = 0.07 * hang * hang;',
    '  vec3 p = position;',
    '  p.z += pleat * aP + wave * aW;',
    '  p.x += sin(uTime * 0.9 + hang * 4.0) * 0.02 * hang;',
    '  float dz = (cos(ph) * 6.2831 * 7.0 * aP + (0.5 * cos(w1) * 9.0 + 0.5 * cos(w2) * 5.0) * aW) / W;',
    '  vWN = normalize(mat3(modelMatrix) * vec3(-dz, 0.0, 1.0));',
    '  vFold = pleat; vec4 wp = modelMatrix * vec4(p, 1.0); vWP = wp.xyz;',
    '  gl_Position = projectionMatrix * viewMatrix * wp;',
    '}'].join('\n');

  // FRAGMENT SHADER #1: curtain fabric (stripes, weave, pleat shading, diffuse, backlit rim glow, hem)
  var curtainFrag = [
    'uniform float uTime; varying vec2 vUv; varying vec3 vWN; varying vec3 vWP; varying float vFold;',
    'void main(){',
    '  vec3 n = normalize(vWN); if (!gl_FrontFacing) n = -n;',
    '  float diff = max(dot(n, normalize(vec3(0.45, 0.8, 0.6))), 0.0) * 0.65 + 0.35;',
    '  float st = step(0.5, fract(vUv.x * 8.0));',
    '  vec3 col = mix(vec3(0.86, 0.45, 0.35), vec3(0.97, 0.84, 0.64), st * 0.55);',
    '  col *= (0.82 + 0.18 * vFold) * (0.93 + 0.07 * sin(vUv.x * 900.0) * sin(vUv.y * 600.0)) * diff;',
    '  float rim = pow(1.0 - abs(dot(n, normalize(cameraPosition - vWP))), 2.0);',
    '  col += vec3(1.0, 0.88, 0.65) * rim * 0.35 * (0.6 + 0.4 * sin(uTime * 0.7));',
    '  float hem = smoothstep(0.93, 0.95, vUv.y) * (1.0 - smoothstep(0.985, 1.0, vUv.y));',
    '  col = mix(col, vec3(0.95, 0.75, 0.30), hem);',
    '  gl_FragColor = vec4(col, 1.0);',
    '}'].join('\n');

  // FRAGMENT SHADER #2: sky outside the window (gradient, sun glow, fbm clouds drifting, glass streak)
  var glassFrag = [
    'uniform float uTime; varying vec2 vUv;',
    'float h(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }',
    'float nz(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);',
    '  return mix(mix(h(i), h(i + vec2(1.0, 0.0)), f.x), mix(h(i + vec2(0.0, 1.0)), h(i + vec2(1.0, 1.0)), f.x), f.y); }',
    'float fbm(vec2 p){ float a = 0.5, s = 0.0; for (int i = 0; i < 4; i++){ s += a * nz(p); p *= 2.02; a *= 0.5; } return s; }',
    'void main(){',
    '  vec2 p = vec2(vUv.x, 1.0 - vUv.y);',
    '  vec3 col = mix(vec3(0.98, 0.80, 0.62), vec3(0.35, 0.62, 0.95), smoothstep(0.0, 0.9, p.y));',
    '  float d = distance(p, vec2(0.72, 0.7));',
    '  col += vec3(1.0, 0.85, 0.5) * (exp(-d * 5.0) * 0.8 + smoothstep(0.07, 0.05, d));',
    '  float c = smoothstep(0.45, 0.8, fbm(p * vec2(3.0, 2.0) + vec2(uTime * 0.03, 0.0)));',
    '  col = mix(col, vec3(1.0), c * 0.85);',
    '  col += smoothstep(0.02, 0.0, abs(p.x - p.y * 0.6 - 0.3 + 0.1 * sin(uTime * 0.2))) * 0.08;',
    '  gl_FragColor = vec4(col, 1.0);',
    '}'].join('\n');

  // FRAGMENT SHADER #3: computer screen (chromatic aberration, scanlines, rolling bar, vignette, flicker)
  var screenFrag = [
    'uniform sampler2D map; uniform float uTime; varying vec2 vUv;',
    'void main(){',
    '  vec2 c = vUv - 0.5; float r = dot(c, c); vec2 off = c * r * 0.012;',
    '  vec3 col = vec3(texture2D(map, vUv + off).r, texture2D(map, vUv).g, texture2D(map, vUv - off).b);',
    '  col *= 0.90 + 0.10 * sin(vUv.y * 564.0 * 3.14159);',
    '  col += exp(-pow((vUv.y - fract(-uTime * 0.12)) * 8.0, 2.0)) * 0.08;',
    '  col *= (1.0 - r * 1.1) * (0.985 + 0.015 * sin(uTime * 55.0));',
    '  gl_FragColor = vec4(col, 1.0);',
    '}'].join('\n');


  // FRAGMENT SHADER #4/#5: wooden floor (planks, grain, per-plank tint) and rug (rings + border), procedural in world space
  var worldVert = 'varying vec3 vWP; void main(){ vec4 wp = modelMatrix * vec4(position, 1.0); vWP = wp.xyz; gl_Position = projectionMatrix * viewMatrix * wp; }';
  var noiseGLSL = [
    'float h(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }',
    'float nz(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);',
    '  return mix(mix(h(i), h(i + vec2(1.0, 0.0)), f.x), mix(h(i + vec2(0.0, 1.0)), h(i + vec2(1.0, 1.0)), f.x), f.y); }'].join('\n');
  var floorFrag = 'varying vec3 vWP;\n' + noiseGLSL + [
    '\nvoid main(){',
    '  vec2 p = vWP.xz; float c = floor(p.x / 0.4); float off = h(vec2(c, 3.0)) * 3.0;',
    '  float q = floor((p.y + off) / 1.6); vec2 id = vec2(c, q);',
    '  float fx = fract(p.x / 0.4), fz = fract((p.y + off) / 1.6);',
    '  float edge = smoothstep(0.0, 0.03, fx) * smoothstep(0.0, 0.03, 1.0 - fx) * smoothstep(0.0, 0.006, fz) * smoothstep(0.0, 0.006, 1.0 - fz);',
    '  float grain = sin(p.x * 60.0 + nz(vec2(p.x * 4.0, p.y * 0.7)) * 8.0) * 0.035;',
    '  vec3 col = vec3(0.725, 0.541, 0.369) * (1.0 + (h(id) - 0.5) * 0.14 + grain) * mix(0.55, 1.0, edge);',
    '  gl_FragColor = vec4(col * 1.05, 1.0);',
    '}'].join('\n');
  var rugFrag = 'varying vec3 vWP;\n' + noiseGLSL + [
    '\nvoid main(){',
    '  vec2 d = vWP.xz - vec2(0.0, 0.5); float r = length(d); float a = atan(d.y, d.x);',
    '  vec3 col = vec3(0.353, 0.498, 0.651);',
    '  col *= 1.0 + 0.18 * (0.5 + 0.5 * sin(r * 18.0));',
    '  col = mix(col, vec3(0.95, 0.85, 0.60), smoothstep(1.46, 1.48, r) * (1.0 - smoothstep(1.60, 1.62, r)));',
    '  col = mix(col, vec3(0.95, 0.60, 0.25), smoothstep(0.05, 0.03, abs(r - 0.7)) * step(0.0, sin(a * 24.0)));',
    '  col *= 0.95 + 0.05 * nz(d * 40.0);',
    '  gl_FragColor = vec4(col * 1.05, 1.0);',
    '}'].join('\n');
  var floorMat = new THREE.ShaderMaterial({ vertexShader: worldVert, fragmentShader: floorFrag });
  var rugMat = new THREE.ShaderMaterial({ vertexShader: worldVert, fragmentShader: rugFrag });

  var curtainMat = new THREE.ShaderMaterial({ uniforms: { uTime: uTime }, vertexShader: curtainVert, fragmentShader: curtainFrag, side: THREE.DoubleSide });
  var glassMat = new THREE.ShaderMaterial({ uniforms: { uTime: uTime }, vertexShader: vertPass, fragmentShader: glassFrag });
  var screenMat = new THREE.ShaderMaterial({ uniforms: { map: { value: screen.tex }, uTime: uTime }, vertexShader: vertPass, fragmentShader: screenFrag });

  var ptrs = new Map(), lastPinch = 0, down = null, sph = new THREE.Spherical(), off = new THREE.Vector3();
  var hint = document.getElementById('hint');

  function pick(cx, cy) {
    mouse.set(cx / window.innerWidth * 2 - 1, -(cy / window.innerHeight) * 2 + 1);
    ray.setFromCamera(mouse, camera);
    var hit = ray.intersectObjects(clickables, true)[0];
    if (!hit) return null;
    var o = hit.object; while (o && !o.userData.view) o = o.parent;
    return o ? o.userData.view : null;
  }
  function orbit(dTheta, dPhi, zoom) {
    off.copy(camera.position).sub(T); sph.setFromVector3(off);
    sph.theta = Math.max(-0.3, Math.min(Math.PI / 2 + 0.3, sph.theta + dTheta));
    sph.phi = Math.max(0.3, Math.min(1.65, sph.phi + dPhi));
    sph.radius = Math.max(2, Math.min(30, sph.radius * zoom));
    camera.position.copy(T).add(off.setFromSpherical(sph));
  }
  var panR = new THREE.Vector3(), panU = new THREE.Vector3(), panD = new THREE.Vector3(), PAN_MIN = V3(-4, 0.2, -4), PAN_MAX = V3(4, 5, 4);
  function pan(dx, dy) {
    var k = 2 * camera.position.distanceTo(T) * Math.tan(camera.fov * Math.PI / 360) / window.innerHeight;
    panR.set(1, 0, 0).applyQuaternion(camera.quaternion);
    panU.set(0, 1, 0).applyQuaternion(camera.quaternion);
    panD.set(0, 0, 0).addScaledVector(panR, -dx * k).addScaledVector(panU, dy * k);
    var nx = Math.max(PAN_MIN.x, Math.min(PAN_MAX.x, T.x + panD.x)) - T.x;
    var ny = Math.max(PAN_MIN.y, Math.min(PAN_MAX.y, T.y + panD.y)) - T.y;
    var nz = Math.max(PAN_MIN.z, Math.min(PAN_MAX.z, T.z + panD.z)) - T.z;
    T.x += nx; T.y += ny; T.z += nz;
    camera.position.x += nx; camera.position.y += ny; camera.position.z += nz;
  }
  function pinch() { var a = Array.from(ptrs.values()); return Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y) || 1; }

  canvas.addEventListener('pointerdown', function (e) {
    canvas.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    down = { x: e.clientX, y: e.clientY, moved: false };
    if (ptrs.size === 2) lastPinch = pinch();
    hint.classList.add('gone');
  });
  canvas.addEventListener('pointermove', function (e) {
    var p = ptrs.get(e.pointerId);
    if (!p) { canvas.style.cursor = pick(e.clientX, e.clientY) ? 'pointer' : (e.shiftKey ? 'move' : 'grab'); return; }
    var dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
    if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6) { down.moved = true; tw = null; }
    if (!down || !down.moved) return;
    if (ptrs.size === 1) {
      if (e.shiftKey) pan(dx, dy); else orbit(-dx * 0.006, -dy * 0.006, 1);
    }
    else if (ptrs.size === 2) { var d = pinch(); orbit(0, 0, lastPinch / d); lastPinch = d; }
  });
  function up(e) {
    var wasClick = down && !down.moved && ptrs.size === 1;
    ptrs.delete(e.pointerId); lastPinch = 0;
    if (wasClick && e.type === 'pointerup') {
      var v = pick(e.clientX, e.clientY);
      if (v === 'paint' && current === 'paint') window.open('800_Paint.html', '_blank', 'noopener');
      else if (v) goTo(v);
    }
    if (!ptrs.size) down = null;
  }
  function shiftCursor(e) { if (e.key === 'Shift' && !ptrs.size) canvas.style.cursor = e.type === 'keydown' ? 'move' : 'grab'; }
  window.addEventListener('keydown', shiftCursor); window.addEventListener('keyup', shiftCursor);
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointercancel', up);
  canvas.addEventListener('wheel', function (e) {
    e.preventDefault(); tw = null; orbit(0, 0, Math.exp(e.deltaY * 0.001)); hint.classList.add('gone');
  }, { passive: false });

  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.fov = w / h < 1 ? 62 : 45; camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize); resize();

  function frame(now) {
    if (tw) {
      var k = Math.min(1, (now - tw.s) / tw.d), e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
      camera.position.lerpVectors(tw.p0, tw.p1, e); T.lerpVectors(tw.t0, tw.t1, e);
      if (k >= 1) tw = null;
    }
    uTime.value = now * 0.001;
    camera.lookAt(T);
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
