<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio — White House</title>
<style>
  :root { --bg: #000000; --hint: #8a8a8a; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  #hint {
    position: fixed; left: 0; right: 0;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
    text-align: center; color: var(--hint);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", "Noto Sans Thai", sans-serif;
    pointer-events: none; transition: opacity .6s;
  }
  #hint.gone { opacity: 0; }
  #err { color: #fff; font: 16px system-ui, sans-serif; padding: 24px; display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">ลากเพื่อหมุน · เลื่อนล้อหรือถ่างนิ้วเพื่อซูม</div>
<div id="err">เบราว์เซอร์นี้ไม่รองรับ WebGL</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  var canvas = document.getElementById('c');
  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  } catch (e) {
    canvas.style.display = 'none';
    document.getElementById('hint').style.display = 'none';
    document.getElementById('err').style.display = 'block';
    return;
  }
  renderer.setClearColor(0x000000, 1);

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x000000);
  var camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);

  // Light setup: top faces stay near-white, side faces fall to grey so the shape reads in the dark
  scene.add(new THREE.AmbientLight(0xffffff, 0.5));
  var key = new THREE.DirectionalLight(0xffffff, 0.65);
  key.position.set(6, 10, 8);
  scene.add(key);
  var fill = new THREE.DirectionalLight(0xffffff, 0.25);
  fill.position.set(-8, 4, -6);
  scene.add(fill);

  var white = new THREE.MeshLambertMaterial({ color: 0xffffff });
  var panel = new THREE.MeshLambertMaterial({ color: 0xcfcfcf });
  var edgeMat = new THREE.LineBasicMaterial({ color: 0x9a9a9a });

  var house = new THREE.Group();

  // Add a mesh plus its outline so edges stay visible against the black background
  function add(geo, mat, x, y, z, outline) {
    var mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x, y, z);
    house.add(mesh);
    if (outline !== false) {
      var lines = new THREE.LineSegments(new THREE.EdgesGeometry(geo), edgeMat);
      lines.position.set(x, y, z);
      house.add(lines);
    }
    return mesh;
  }

  var W = 6, D = 5, H = 4;          // wall width, depth, height

  add(new THREE.BoxGeometry(W + 1.4, 0.4, D + 1.4), white, 0, -0.2, 0);   // base slab
  add(new THREE.BoxGeometry(W, H, D), white, 0, H / 2, 0);               // walls

  // Gabled roof: a triangular prism extruded across the depth of the house
  var tri = new THREE.Shape();
  tri.moveTo(-(W / 2 + 0.5), 0);
  tri.lineTo(W / 2 + 0.5, 0);
  tri.lineTo(0, 2.4);
  tri.closePath();
  var roofGeo = new THREE.ExtrudeGeometry(tri, { depth: D + 0.8, bevelEnabled: false });
  roofGeo.translate(0, 0, -(D + 0.8) / 2);
  add(roofGeo, white, 0, H, 0);

  // Front door and windows, slightly recessed panels on the +Z face
  add(new THREE.BoxGeometry(1.2, 2.2, 0.16), panel, 0, 1.1, D / 2 + 0.02);
  add(new THREE.BoxGeometry(1.1, 1.1, 0.16), panel, -1.9, 2.3, D / 2 + 0.02);
  add(new THREE.BoxGeometry(1.1, 1.1, 0.16), panel, 1.9, 2.3, D / 2 + 0.02);
  // Side windows
  add(new THREE.BoxGeometry(0.16, 1.1, 1.1), panel, W / 2 + 0.02, 2.3, -0.9);
  add(new THREE.BoxGeometry(0.16, 1.1, 1.1), panel, -(W / 2 + 0.02), 2.3, -0.9);

  add(new THREE.BoxGeometry(0.8, 1.8, 0.8), white, -1.7, H + 1.4, -1.0);  // chimney

  house.position.y = -1.6;
  scene.add(house);

  // Orbit camera: drag to rotate, wheel or pinch to zoom
  var target = new THREE.Vector3(0, 0.6, 0);
  var theta = Math.PI / 5, phi = 1.15, radius = 16;
  var vTheta = 0, vPhi = 0;
  var MIN_R = 7, MAX_R = 50;
  var reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var autoRotate = !reduceMotion;

  var pointers = new Map();
  var lastPinch = 0;
  var hint = document.getElementById('hint');

  function interacted() {
    autoRotate = false;
    hint.classList.add('gone');
  }

  canvas.addEventListener('pointerdown', function (e) {
    canvas.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 2) lastPinch = pinchDist();
    interacted();
  });
  canvas.addEventListener('pointermove', function (e) {
    var p = pointers.get(e.pointerId);
    if (!p) return;
    var dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    if (pointers.size === 1) {
      vTheta = -dx * 0.006;
      vPhi = -dy * 0.006;
      theta += vTheta;
      phi += vPhi;
    } else if (pointers.size === 2) {
      var d = pinchDist();
      if (lastPinch) radius *= lastPinch / d;
      lastPinch = d;
    }
    clamp();
  });
  function endPointer(e) { pointers.delete(e.pointerId); lastPinch = 0; }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  canvas.addEventListener('wheel', function (e) {
    e.preventDefault();
    radius *= Math.exp(e.deltaY * 0.001);
    clamp();
    interacted();
  }, { passive: false });

  function pinchDist() {
    var pts = Array.from(pointers.values());
    return Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) || 1;
  }
  function clamp() {
    phi = Math.max(0.2, Math.min(Math.PI / 2 + 0.25, phi));
    radius = Math.max(MIN_R, Math.min(MAX_R, radius));
  }

  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.fov = w / h < 1 ? 60 : 45;   // keep the house framed on narrow screens
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  function frame() {
    if (autoRotate) theta += 0.003;
    if (pointers.size === 0) {
      theta += vTheta; phi += vPhi;          // inertia after a drag
      vTheta *= 0.92; vPhi *= 0.92;
      if (Math.abs(vTheta) < 1e-5) vTheta = 0;
      if (Math.abs(vPhi) < 1e-5) vPhi = 0;
      clamp();
    }
    camera.position.set(
      target.x + radius * Math.sin(phi) * Math.sin(theta),
      target.y + radius * Math.cos(phi),
      target.z + radius * Math.sin(phi) * Math.cos(theta)
    );
    camera.lookAt(target);
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  frame();
})();
</script>
</body>
</html>
