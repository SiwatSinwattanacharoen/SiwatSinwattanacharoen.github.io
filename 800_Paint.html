<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>MyPaint - Assignment #2</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, "Tahoma", sans-serif;
    background: #ffffff;
    padding: 16px;
  }

  h3 { margin: 0 0 10px 0; font-size: 15px; font-weight: normal; }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }
  .tool-btn {
    height: 32px;
    padding: 0 12px;
    font-size: 13px;
    border: 1px solid #999;
    background: #fff;
    cursor: pointer;
  }
  .tool-btn:hover { background: #f0f0f0; }
  .tool-btn.active {
    background: #dbe9ff;
    border: 1px solid #3b82f6;
  }

  .sep { width: 1px; height: 24px; background: #ccc; margin: 0 4px; }




  #canvas {
    background: #fff;
    border: 1px solid #000;
    cursor: crosshair;
    display: block;
  }

  .palette-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
  }

  .palette-grid {
    display: grid;
    grid-template-columns: repeat(6, 24px);
    grid-template-rows: 24px;
    gap: 3px;
  }
  .swatch {
    width: 24px; height: 24px;
    border: 1px solid #999;
    cursor: pointer;
  }
  .swatch.selected { outline: 2px solid #000; outline-offset: 1px; }

  .custom-color {
    display: flex; align-items: center; gap: 4px; font-size: 12px;
  }


</style>
</head>
<body>

<div class="toolbar">
  <button class="tool-btn" id="tool-pencil">Pencil</button>
  <button class="tool-btn" id="tool-eraser">Eraser</button>
  <button class="tool-btn" id="tool-line">Line</button>
  <button class="tool-btn" id="tool-rect">Rectangle</button>
  <button class="tool-btn" id="tool-ellipse">Ellipse</button>

  <div class="sep"></div>

  <label style="font-size:13px;">ความหนา:</label>
  <span id="sizeDisplay" style="display:inline-block; width:24px; text-align:center; font-size:14px; font-weight:bold; border:1px solid #999; padding:4px 2px;">2</span>
</div>

<canvas id="canvas" width="700" height="420"></canvas>

<div class="palette-row">
  <div class="palette-grid" id="paletteGrid"></div>
</div>

<div id="posText" style="font-size:12px; color:#555; margin-top:6px;">x:0 y:0</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const imageData = ctx.createImageData(canvas.width, canvas.height);
const pixels = imageData.data;

function putPixel(x, y, r, g, b, a = 255) {
  if (x < 0 || y < 0 || x >= canvas.width || y >= canvas.height) return;
  const idx = (y * canvas.width + x) * 4;
  pixels[idx] = r;
  pixels[idx + 1] = g;
  pixels[idx + 2] = b;
  pixels[idx + 3] = a;
}

function putPixelThick(x, y, size, r, g, b, a = 255) {
  const half = Math.floor(size / 2);
  for (let dy = -half; dy < size - half; dy++) {
    for (let dx = -half; dx < size - half; dx++) {
      putPixel(x + dx, y + dy, r, g, b, a);
    }
  }
}

function drawLine(x1, y1, x2, y2, r, g, b, a = 255, size = 1) {
  const dx = Math.abs(x2 - x1);
  const dy = Math.abs(y2 - y1);

  if (dx === 0 && dy === 0) {
    putPixelThick(x1, y1, size, r, g, b, a);
    return;
  }

  if (dx > dy) {
    const m = (y2 - y1) / (x2 - x1);
    const c = y1 - m * x1;
    for (let x = Math.min(x1, x2); x <= Math.max(x1, x2); x++) {
      const y = Math.round(m * x + c);
      putPixelThick(x, y, size, r, g, b, a);
    }
  } else {
    const m = (x2 - x1) / (y2 - y1);
    const c = x1 - m * y1;
    for (let y = Math.min(y1, y2); y <= Math.max(y1, y2); y++) {
      const x = Math.round(m * y + c);
      putPixelThick(x, y, size, r, g, b, a);
    }
  }
}

function drawRect(x1, y1, x2, y2, r, g, b, a = 255, size = 1) {
  drawLine(x1, y1, x2, y1, r, g, b, a, size);
  drawLine(x2, y1, x2, y2, r, g, b, a, size);
  drawLine(x2, y2, x1, y2, r, g, b, a, size);
  drawLine(x1, y2, x1, y1, r, g, b, a, size);
}

function drawRectFilled(x1, y1, x2, y2, r, g, b, a = 255) {
  const xMin = Math.min(x1, x2), xMax = Math.max(x1, x2);
  const yMin = Math.min(y1, y2), yMax = Math.max(y1, y2);
  for (let y = yMin; y <= yMax; y++) {
    for (let x = xMin; x <= xMax; x++) {
      putPixel(x, y, r, g, b, a);
    }
  }
}

function drawEllipse(cx, cy, rx, ry, r, g, b, a = 255, size = 1) {
  const rxIn = Math.max(rx - size, 0);
  const ryIn = Math.max(ry - size, 0);
  for (let y = -ry; y <= ry; y++) {
    for (let x = -rx; x <= rx; x++) {
      const outer = (x * x) / (rx * rx) + (y * y) / (ry * ry) <= 1;
      const inner = rxIn > 0 && ryIn > 0 &&
        (x * x) / (rxIn * rxIn) + (y * y) / (ryIn * ryIn) <= 1;
      if (outer && !inner) putPixel(cx + x, cy + y, r, g, b, a);
    }
  }
}

function drawEllipseFilled(cx, cy, rx, ry, r, g, b, a = 255) {
  for (let y = -ry; y <= ry; y++) {
    for (let x = -rx; x <= rx; x++) {
      if ((x * x) / (rx * rx) + (y * y) / (ry * ry) <= 1) {
        putPixel(cx + x, cy + y, r, g, b, a);
      }
    }
  }
}

function toScaledMousePos(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  return {
    x: Math.floor((clientX - rect.left) * scaleX),
    y: Math.floor((clientY - rect.top) * scaleY)
  };
}

function render() {
  ctx.putImageData(imageData, 0, 0);
}

function clearCanvas() {
  drawRectFilled(0, 0, canvas.width - 1, canvas.height - 1, 255, 255, 255);
  render();
}
clearCanvas();

let currentTool = 'pencil';
let brushSize = 2;

let fg = { r: 0, g: 0, b: 0 };
let bg = { r: 255, g: 255, b: 255 };

let isDragging = false;
let mouseButton = 0;
let startX = 0, startY = 0, prevX = 0, prevY = 0;
let snapshot = null;

canvas.addEventListener('contextmenu', (e) => e.preventDefault());

canvas.addEventListener('mousedown', (event) => {
  const { x, y } = toScaledMousePos(event.clientX, event.clientY);
  isDragging = true;
  mouseButton = event.button;
  startX = x; startY = y;
  prevX = x; prevY = y;

  const color = mouseButton === 2 ? bg : fg;

  if (currentTool === 'pencil') {
    putPixelThick(x, y, brushSize, color.r, color.g, color.b);
    render();
  } else if (currentTool === 'eraser') {
    putPixelThick(x, y, Math.max(brushSize, 8), bg.r, bg.g, bg.b);
    render();
  } else {
    snapshot = pixels.slice();
  }
});

canvas.addEventListener('mousemove', (event) => {
  const { x, y } = toScaledMousePos(event.clientX, event.clientY);
  document.getElementById('posText').textContent = `x:${x} y:${y}`;
  if (!isDragging) return;

  const color = mouseButton === 2 ? bg : fg;

  if (currentTool === 'pencil') {
    drawLine(prevX, prevY, x, y, color.r, color.g, color.b, 255, brushSize);
    render();
    prevX = x; prevY = y;
  } else if (currentTool === 'eraser') {
    const eSize = Math.max(brushSize, 8);
    drawLine(prevX, prevY, x, y, bg.r, bg.g, bg.b, 255, eSize);
    render();
    prevX = x; prevY = y;
  } else if (snapshot) {
    pixels.set(snapshot);
    if (currentTool === 'line') {
      drawLine(startX, startY, x, y, color.r, color.g, color.b, 255, brushSize);
    } else if (currentTool === 'rect') {
      drawRect(startX, startY, x, y, color.r, color.g, color.b, 255, brushSize);
    } else if (currentTool === 'ellipse') {
      const cx = Math.round((startX + x) / 2);
      const cy = Math.round((startY + y) / 2);
      const rx = Math.max(Math.abs(x - startX) / 2, 1);
      const ry = Math.max(Math.abs(y - startY) / 2, 1);
      drawEllipse(cx, cy, rx, ry, color.r, color.g, color.b, 255, brushSize);
    }
    render();
  }
});

window.addEventListener('mouseup', () => {
  isDragging = false;
  snapshot = null;
});

const toolIds = {
  pencil: 'tool-pencil',
  eraser: 'tool-eraser',
  line: 'tool-line',
  rect: 'tool-rect',
  ellipse: 'tool-ellipse'
};

function selectTool(tool) {
  currentTool = tool;
  Object.values(toolIds).forEach(id => document.getElementById(id).classList.remove('active'));
  document.getElementById(toolIds[tool]).classList.add('active');
}

Object.entries(toolIds).forEach(([tool, id]) => {
  document.getElementById(id).addEventListener('click', () => selectTool(tool));
});
selectTool('pencil');

window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowUp') {
    e.preventDefault();
    brushSize = Math.min(brushSize + 1, 20);
    document.getElementById('sizeDisplay').textContent = brushSize;
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    brushSize = Math.max(brushSize - 1, 1);
    document.getElementById('sizeDisplay').textContent = brushSize;
  }
});

const paletteColors = [
  '#000000', '#ff0000', '#00a000', '#0000ff', '#ffe000', '#800080'
];

const grid = document.getElementById('paletteGrid');
paletteColors.forEach((hex, i) => {
  const sw = document.createElement('div');
  sw.className = 'swatch';
  sw.style.background = hex;
  if (i === 0) sw.classList.add('selected');
  sw.addEventListener('click', (e) => setColor(hex, e.shiftKey ? 'bg' : 'fg'));
  sw.addEventListener('contextmenu', (e) => { e.preventDefault(); setColor(hex, 'bg'); });
  grid.appendChild(sw);
});

function hexToRgb(hex) {
  const v = parseInt(hex.slice(1), 16);
  return { r: (v >> 16) & 255, g: (v >> 8) & 255, b: v & 255 };
}

function setColor(hex, target) {
  const rgb = hexToRgb(hex);
  if (target === 'bg') {
    bg = rgb;
  } else {
    fg = rgb;
  }
  document.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
  const match = [...document.querySelectorAll('.swatch')]
    .find(s => s.style.background === hexToRgbString(hex));
  if (match) match.classList.add('selected');
}
function hexToRgbString(hex) {
  const { r, g, b } = hexToRgb(hex);
  return `rgb(${r}, ${g}, ${b})`;
}

</script>
</body>
</html>
